# ============================================================
# AUTOMATED ACCESSIBILITY CHECK
#
# WHEN THIS RUNS
# On every push to main, on every pull request, and on demand:
#     gh workflow run accessibility-check.yml
#
# WHAT IT DOES
# Builds the site and runs every page through Axe, the standard
# accessibility testing engine. Each page is checked three times:
# in the light theme, in the dark theme, and at 360 pixels wide.
# It also checks that no page scrolls sideways at phone width.
# If anything fails, THE RUN FAILS.
#
# The checking itself lives in scripts/check-accessibility.mjs,
# so the same command runs here and on your own machine:
#     npm run build
#     npm run check-a11y
#
# HONEST LIMITS, WHICH MATTER
# An automated check finds roughly a third of accessibility
# problems. It can see that an image has no alt text. It cannot
# see that the alt text says "chart" instead of what the chart
# shows. It can see a contrast failure. It cannot see that a
# colour is the only thing distinguishing two lines on a graph.
#
# So this catches the careless mistakes and frees attention for
# the manual checks in CLAUDE.md section 9, which are the ones
# that actually matter: tab through it with no mouse, zoom to
# 200%, open it at 360 pixels wide, read the chart's alt text
# aloud and ask whether it conveys the finding.
#
# WHEN IT FAILS
# Run "gh run view --log-failed" to see which rule broke on which
# page. Axe names the element and links to an explanation of why
# the rule exists.
# ============================================================

name: Accessibility check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      # Puppeteer downloads a browser that matches the version it
      # expects. That is why the check uses it rather than the axe
      # command line tool: that tool relies on whatever Chrome the
      # build machine happens to have, and the run fails whenever
      # GitHub updates it.
      - name: Install the browser
        run: npx puppeteer browsers install chrome

      # Checks every page in light, in dark, and at 360 pixels wide,
      # and fails the run on any violation. See the top of
      # scripts/check-accessibility.mjs for what this can and
      # cannot see.
      - name: Run the accessibility checks
        run: npm run check-a11y
